deployment:
  tasks:
    - export DEPLOY_DIR=${HOME}/public_html  # Ensure correct deployment directory
    - mkdir -p ${DEPLOY_DIR}  # Create directory if missing
    - find ${DEPLOY_DIR} -type f -delete  # Remove old files safely
    - /bin/cp -r assets forms index.html Readme.txt ${DEPLOY_DIR}/  # Copy new files
    - /bin/chmod -R 755 ${DEPLOY_DIR}  # Set correct permissions
